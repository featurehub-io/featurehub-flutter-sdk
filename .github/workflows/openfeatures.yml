name: OpenFeature SDKs

on:
  push:
    branches: [ main ]
    paths:
      - 'featurehub-openfeatures-*/**'
      - 'featurehub-sse-client/**'
      - 'featurehub-client-api/**'
      - '.github/workflows/openfeatures.yml'
      - '.github/scripts/check-web-imports.sh'
  pull_request:
    paths:
      - 'featurehub-openfeatures-*/**'
      - 'featurehub-sse-client/**'
      - 'featurehub-client-api/**'
      - '.github/workflows/openfeatures.yml'
      - '.github/scripts/check-web-imports.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.package }} (Dart ${{ matrix.sdk }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # a release version (e.g. 3.12) installs the latest patch of that release
        sdk: [ '3.12', '3.14' ]
        package:
          - featurehub-openfeatures-common
          - featurehub-openfeatures-server-sdk
          - featurehub-openfeatures-client-sdk
          - featurehub-openfeatures-store-localstorage
          - featurehub-openfeatures-store-redis
          - featurehub-openfeatures-yaml-interceptor

    # for the Redis store's integration tests
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    defaults:
      run:
        working-directory: ${{ matrix.package }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install dependencies
        run: dart pub get

      # formatter output can change between SDK releases, so only check it on
      # the minimum supported SDK
      - name: Verify formatting
        if: matrix.sdk == '3.12'
        run: dart format --output=none --set-exit-if-changed lib test $(test -d tool && echo tool)

      - name: Analyze
        run: dart analyze --fatal-infos

      # the local storage store's tests run in Chrome (see its dart_test.yaml)
      - name: Run tests (VM)
        run: dart test
        env:
          FEATUREHUB_TEST_REDIS: localhost:6379

      # the server SDK, Redis store and YAML interceptor are dart:io only
      - name: Run tests (Chrome)
        if: >-
          matrix.package == 'featurehub-openfeatures-common' ||
          matrix.package == 'featurehub-openfeatures-client-sdk'
        run: dart test -p chrome

      # the client SDK, and the common package it is built on, must stay
      # compatible with WebAssembly: tool/wasm_check.dart pulls in their
      # public libraries (and those of featurehub_sse_client and
      # featurehub_client_api) with their browser variants, and must compile
      - name: Build for WebAssembly
        if: >-
          matrix.package == 'featurehub-openfeatures-common' ||
          matrix.package == 'featurehub-openfeatures-client-sdk'
        run: dart compile wasm tool/wasm_check.dart -o build/wasm_check.wasm

      # the compilers accept some things that only fail when they run (dart:io,
      # numbers from JavaScript arriving as doubles): the browser tests again,
      # compiled to WebAssembly
      - name: Run tests (Chrome, WebAssembly)
        if: >-
          matrix.package == 'featurehub-openfeatures-common' ||
          matrix.package == 'featurehub-openfeatures-client-sdk'
        run: dart test -p chrome -c dart2wasm

  web-imports:
    name: Web and WebAssembly imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # dart2js and dart2wasm both accept an unconditional dart:io import, which
      # only fails at runtime: no library the client SDK builds into a browser
      # may have one
      - name: Check imports
        run: .github/scripts/check-web-imports.sh
