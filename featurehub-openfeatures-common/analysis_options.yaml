include: package:lints/recommended.yaml

linter:
  rules:
    - avoid_print

analyzer:
  errors:
    # featurehub_sse_client and featurehub_client_api are path dependencies
    # until their new versions are published; `dart pub publish` still
    # refuses path dependencies, so this cannot slip through to a release
    invalid_dependency: ignore
  exclude:
    - build/**
    - example/**
