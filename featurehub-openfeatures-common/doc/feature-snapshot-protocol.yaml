# FeatureHub feature snapshots and transports: a machine-readable specification.
#
# Describes, precisely enough to reimplement in another language:
#   1. the encoding (FeatureState, FeatureSnapshot, the SHA, the ETag);
#   2. the snapshot server (your own server re-serving FeatureHub features);
#   3. the snapshot client (polling / passive refresh with If-None-Match);
#   4. the transport contract (how any source fills a feature repository);
#   5. how providers choose and wire a transport.
#
# Reference implementation: the Dart SDK in this repository,
#   featurehub-openfeatures-common (lib/src/feature_snapshot.dart,
#   lib/src/repository.dart, lib/src/openfeature/feature_snapshot_client.dart,
#   lib/src/openfeature/featurehub_transport.dart,
#   lib/src/openfeature/featurehub_connection.dart,
#   lib/src/openfeature/context_mapper.dart), and the server example
#   featurehub-openfeatures-server-sdk/example/main.dart (GET /features).
#
# Conventions: MUST / SHOULD / MAY as in RFC 2119. "repository" is the local
# in-memory store of features that resolutions read from. Everything marked
# `reference_behaviour` is what the Dart SDK does; implementations SHOULD match
# it so clients and servers in different languages interoperate.

spec:
  name: featurehub-feature-snapshot
  version: 1.0.0
  status: implemented-in-dart
  related:
    featurehub_edge_sse_events: FeatureHub Edge's own SSE stream (event names reused, see transport.relaying_featurehub_events)
    strategy_evaluation: >-
      rollout-strategies.yaml (murmur3 percentage rollouts and the STRING,
      NUMBER, DATE, DATETIME, SEMANTIC_VERSION, IP_ADDRESS and BOOLEAN
      matchers, with the golden fixture as the conformance suite).
    openfeature_resolution: openfeature-resolution.yaml (what a provider does with a feature once it is in the repository)
    feature_stores: feature-store.yaml (stores, raw feature updates, the shared storage formats)

# ---------------------------------------------------------------------------
# 1. Encoding
# ---------------------------------------------------------------------------
encoding:
  media_type: application/json
  charset: utf-8

  feature_state:
    description: >-
      One feature, as FeatureHub Edge delivers it. The same JSON object is used
      on FeatureHub's own API, in snapshots, and in transport notifications.
    json_schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: featurehub/feature-state
      type: object
      required: [id, key, version, type]
      properties:
        id: {type: string, description: "Feature value id. Unique per feature; used for sorting in the SHA."}
        key: {type: string, description: "Feature key, as used by code."}
        l: {type: boolean, default: false, description: "Locked in its environment."}
        version: {type: integer, description: "Increases whenever the feature changes in FeatureHub. Decoders MUST accept a JSON number and truncate to integer."}
        type: {enum: [BOOLEAN, STRING, NUMBER, JSON]}
        value:
          description: >-
            Absent or null = no value (resolves to the code default). BOOLEAN:
            boolean. STRING: string. NUMBER: number. JSON: a string holding JSON
            text (not a nested object).
        v: {type: [string, "null"], description: "Id of the rollout strategy that supplied `value` (server-evaluated or snapshot-evaluated features); null/absent if the default value applies."}
        fp: {type: object, additionalProperties: {type: string}, description: "Feature properties (string to string). Optional."}
        environmentId: {type: string, description: "Optional."}
        strategies:
          type: array
          description: "Rollout strategies, in evaluation order. Present only when the receiver is to evaluate locally (client-evaluated keys, or a raw snapshot)."
          items: {$ref: "featurehub/rollout-strategy"}
      additionalProperties: true
    encoding_rules:
      - Encoders SHOULD omit `value`, `v`, `fp`, `environmentId` and `strategies` when null (the Dart encoder does).
      - Encoders MUST always write `id`, `key`, `l`, `version`, `type`.
      - Decoders MUST ignore unknown properties.

  rollout_strategy:
    json_schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: featurehub/rollout-strategy
      type: object
      required: [id]
      properties:
        id: {type: string}
        value: {description: "The value given when this strategy matches (same typing rules as feature_state.value)."}
        percentage: {type: [integer, "null"], description: "Optional percentage rollout, out of 1,000,000; absent or null means none."}
        percentageAttributes: {type: [array, "null"], items: {type: string}, description: "Nullable; absent or null has the same meaning as an empty list."}
        attributes:
          type: [array, "null"]
          description: "Nullable; absent or null has the same meaning as an empty list (e.g. a pure percentage strategy)."
          items:
            type: object
            required: [conditional, fieldName, type]
            properties:
              id: {type: string}
              conditional: {enum: [EQUALS, ENDS_WITH, STARTS_WITH, GREATER, GREATER_EQUALS, LESS, LESS_EQUALS, NOT_EQUALS, INCLUDES, EXCLUDES, REGEX]}
              fieldName: {type: string}
              values: {type: [array, "null"], description: "Nullable; absent or null has the same meaning as an empty list."}
              type: {enum: [STRING, SEMANTIC_VERSION, NUMBER, DATE, DATETIME, BOOLEAN, IP_ADDRESS]}

    decoding_rules:
      - "attributes, percentageAttributes, an attribute's values and percentage are nullable, and may be absent: decoders MUST accept null and absence (other SDKs keep them as null; the Dart one decodes the lists as empty lists)"
      - "the meaning is the same either way: evaluation (rollout-strategies.yaml) treats a null or absent list exactly like an empty one, and a null percentage as none"
    dart_status: >-
      Dart only: the Dart decoder (featurehub_client_api
      FeatureRolloutStrategy) treats a null or absent values or
      percentageAttributes as an empty list, but throws a DeserialisationError
      for a null or absent attributes, which fails the whole feature. That is a
      known gap against this rule, in the Dart SDK alone.
    other_languages: >-
      Every other language (Go, TypeScript, Java, ...) decodes a null or absent
      attributes, percentageAttributes or values as null, and evaluates it as
      an empty list; their encoders may write null for an empty list.

  feature_snapshot:
    description: >-
      The features a repository holds plus their SHA, as served by a snapshot
      server and read by a snapshot client.
    json_schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: featurehub/feature-snapshot
      type: object
      required: [features]
      properties:
        sha: {type: string, pattern: "^[0-9a-f]{64}$", description: "See encoding.sha. Optional on input (computed if absent)."}
        features: {type: array, items: {$ref: "featurehub/feature-state"}}
    example:
      sha: 90efe21f27585227b23a9782d8aabd8b5139cda839df1a0b8b60fe4c6673c9fd
      features:
        - {id: f1, key: FEATURE_STRING, l: false, version: 2, type: STRING, value: green, v: nz, environmentId: env}
        - {id: f2, key: FEATURE_TITLE_TO_UPPERCASE, l: false, version: 1, type: BOOLEAN, value: true, environmentId: env}
    decoding:
      description: >-
        A reader (Dart: FeatureSnapshot.from) MUST accept any of these inputs and
        fail with a format error otherwise, leaving the repository unchanged:
      accepted_inputs:
        - an already-decoded snapshot object
        - a JSON string (decoded first; invalid JSON is a format error)
        - an object/map with `features` (an array) and optional `sha`; if `sha` is absent or not a string it is computed from the features
        - a bare array of features; the sha is computed
      errors:
        - "`features` missing or not an array"
        - "any element is not a decodable feature_state (missing id/key/version/type, or bad type)"
        - "anything else (number, null, HTML, ...)"
      version_required: >-
        `version` is required in every feature of a snapshot: a feature whose
        version is absent or null is a format error. Decoders MUST NOT default
        it to 0 (the SHA, the update rule and change events all depend on it).

  sha:
    description: >-
      Identifies a set of features by their ids and versions only (not values).
      Every FeatureHub SDK computes it the same way (the Redis store keys and the
      snapshot ETag use it).
    algorithm:
      - take the features (the repository's current features; keys that code has only asked for, with no feature, are excluded)
      - sort by `id`, ascending, by plain string comparison (UTF-16 code unit order; equal to code point order for BMP ids)
      - map each to "<id>:<version>" (version as a base-10 integer)
      - join with "|"
      - SHA-256 of the UTF-8 bytes, as 64 lowercase hex characters
    when_recomputed: >-
      The repository recomputes it after every applied change: a full set of
      features, a single feature update, a delete, and clearing the features.
      In SDKs that support catch-and-release (only some do, typically those
      for user interfaces; see feature-store.yaml catch_and_release), also
      after a release, and while updates are held back it describes the
      applied features, not those held back.
    test_vectors:
      - features: []
        input: ""
        sha: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
      - features: [{id: only, version: 0}]
        input: "only:0"
        sha: 03a55f20ac287349c236160cf813e321e0084e7c2cdef7cabf43374a85a971a8
      - features:
          - {id: f3c1a2b4-1d2e-4c5b-9a8b-7c6d5e4f3a2b, version: 3}
          - {id: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d, version: 12}
          - {id: a0000000-0000-4000-8000-000000000000, version: 1}
        input: "0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d:12|a0000000-0000-4000-8000-000000000000:1|f3c1a2b4-1d2e-4c5b-9a8b-7c6d5e4f3a2b:3"
        sha: ffef4b48076b58be67b0abe8baa76b13915242208613701a2d3a8328e3eb4ef1
      - features: [{id: f1, version: 2}, {id: f2, version: 1}]
        input: "f1:2|f2:1"
        sha: 90efe21f27585227b23a9782d8aabd8b5139cda839df1a0b8b60fe4c6673c9fd

  etag:
    format: 'the SHA in double quotes: "<sha>"  (a strong entity tag)'
    example: '"90efe21f27585227b23a9782d8aabd8b5139cda839df1a0b8b60fe4c6673c9fd"'
    why_valid_per_url: >-
      The SHA covers ids and versions only, so different contexts get the same
      ETag. This is still a correct validator because the context is in the
      URL (query parameters) and HTTP caches/clients validate per URL, and the
      evaluated values for a fixed context only change when a feature's
      version changes (which changes the SHA). If a context were ever carried
      in a header instead of the URL, the ETag MUST also incorporate the
      context.

  evaluation_context:
    description: >-
      How an OpenFeature evaluation context (a map, targeting key under
      `targetingKey`) becomes FeatureHub attributes (Dart: mapEvaluationContext,
      MappedContext).
    rules:
      - entries with a null value are skipped
      - "`targetingKey` or `userkey` (case-insensitive) becomes `userkey`; its value is stringified (see wire_value)"
      - "the well-known keys device, platform, version, country, session are recognised case-insensitively and written lowercase"
      - any other key passes through unchanged (case preserved)
      - "allowed values: string, number, boolean, date-time, or a list of those"
      - "any other value (an object, or a list containing one) is an invalid context: server -> 400; client provider -> INVALID_CONTEXT error"
      - "attribute order: userkey first, then the others"
    wire_value:
      description: How each attribute value becomes a string when sent (query parameter or x-featurehub header).
      rules:
        - "date-time: UTC ISO-8601 (e.g. 2026-11-17T02:47:28.000Z)"
        - "number: JavaScript String(n) - whole floats without a fraction (3.0 -> \"3\"), NaN -> \"NaN\", Infinity -> \"Infinity\""
        - "boolean: \"true\" / \"false\""
        - "string: as is"
        - "list: one string per element (each element by the rules above)"
    x_featurehub_header:
      description: >-
        FeatureHub's server-evaluated context header (also the `xfeaturehub`
        query parameter for browser SSE). Not used by the snapshot client, but
        exposed to custom transports as FeatureHubTransportTarget.contextHeader.
      format: >-
        for each attribute: "<key>=" + query-component-encode(values joined by ",");
        sort these strings; join with ","; no attributes -> no header.
      example: "country=nz,userkey=fred"

# ---------------------------------------------------------------------------
# 2. Snapshot server
# ---------------------------------------------------------------------------
server:
  description: >-
    Your own server, connected to FeatureHub with a client-evaluated API key
    (see api_key_requirement), re-serving features to its own clients. Reference: GET /features in
    featurehub-openfeatures-server-sdk/example/main.dart, using
    ClientFeatureRepository.featureSnapshot.
  endpoint:
    method: GET
    path: /features   # any path; clients are configured with the full URL
    request:
      query_parameters:
        description: >-
          The evaluation context. Each distinct name is an attribute; a name
          given once is a string, a name repeated is a list of strings. All
          values arrive as strings. `targetingKey` or `userkey` is the user key.
          Decode both "+" and "%20" as space.
        example: "/features?userkey=fred&country=nz&tags=a&tags=b"
        resulting_context: {userkey: fred, country: nz, tags: [a, b]}
      headers:
        If-None-Match: optional; see conditional_requests
        Accept: application/json (clients send it; servers MAY ignore)
    conditional_requests:
      etag: 'encoding.etag of the repository SHA at request time'
      if_none_match_matching:
        - split the header value on ","
        - trim each tag
        - strip a leading "W/" (weak comparison)
        - it matches if any tag is "*" or equals the current ETag exactly (quotes included)
      on_match: '304 Not Modified, empty body, headers ETag and Cache-Control: no-cache'
      check_order: the If-None-Match check MAY happen before evaluating the context (the reference does it first)
    evaluation:
      with_context:
        description: >-
          Used whenever the server evaluates for the request (the reference
          does so for every request, an empty query being an empty context).
          The result is exactly what FeatureHub Edge would send for a
          server-evaluated key.
        per_feature:
          - "if the feature has no strategies (absent or empty): output a copy as is, keeping its `v`"
          - "otherwise apply the strategies, in order, to the context (spec.related.strategy_evaluation)"
          - "output: id, key, l, version, type, fp (copy), environmentId unchanged; value = matched strategy's value, else the feature's value; v = matched strategy's id, else null; strategies omitted"
      without_context:
        description: >-
          "As delivered": deep copies with strategies, for clients that
          evaluate locally (e.g. a server provider using sendContext=false).
          Exposes every strategy and its values: only serve this to trusted
          clients.
      value_interceptors: not applied (local overrides stay local)
      sha: the repository SHA when the snapshot is taken (covers all features, unaffected by the context)
    stale_environment: >-
      Not part of this protocol. 236 (a stale environment) is only sent by
      FeatureHub Edge's polling API (featurehub_edge.polling); a snapshot
      server is not required to send it. When its own FeatureHub environment
      goes stale it keeps serving the last features as usual (200 / 304).
    responses:
      - status: 200
        when: features served
        headers: {Content-Type: application/json, ETag: '"<sha>"', Cache-Control: no-cache}
        body: encoding.feature_snapshot
      - status: 304
        when: If-None-Match matches
        headers: {ETag: '"<sha>"', Cache-Control: no-cache}
      - status: 400
        when: invalid context (encoding.evaluation_context rules)
        body: text message
      - status: 503
        when: the server has no features yet (its own FeatureHub connection is not initialised)
      - status: "401/403/404 or other 4xx"
        when: server-specific rejections; clients treat these as permanent (see client.responses)
    cors:
      description: Needed when browser clients on another origin call it.
      requirements:
        - answer the OPTIONS preflight (If-None-Match and any custom headers are not CORS-safelisted, so browsers preflight)
        - "Access-Control-Allow-Origin: * (or the origin)"
        - "Access-Control-Allow-Headers: *, or at least if-none-match plus any custom headers"
        - "Access-Control-Expose-Headers: ETag (so script can read it)"
  api_key_requirement:
    rule: >-
      A snapshot server MUST connect to FeatureHub with a client-evaluated
      API key (one containing `*`), so its repository holds every feature's
      rollout strategies and can evaluate them for each request's context.
    why: >-
      With a server-evaluated key, FeatureHub evaluates the features for the
      server's own single context and sends them without strategies.
      Evaluating those "for a request's context" changes nothing, so every
      client would silently get the server's one context's values, and the
      ETag (the SHA of ids and versions) would not reveal it.
    enforcement: >-
      A snapshot server MUST refuse to run with a server-evaluated key:
      either refuse to start, or answer every features request with an error
      (e.g. 500 or 503) rather than serve another context's values. The
      reference example refuses to start. (For the same reason the Redis
      store refuses to attach to a server-evaluated key.)
    feature_stores_and_no_key: >-
      A server whose provider has no FeatureHub key (its features come from
      stores, or from another server with sendContext false) is fine as long
      as its features keep their strategies.
  open_question: >-
    The reference example always evaluates (no query = empty context = default
    values). Clients that evaluate locally (sendContext=false, the server
    provider's default) need the without_context form. Undecided whether that
    should be served when the query is empty, or from a separate endpoint.

# ---------------------------------------------------------------------------
# 3. Snapshot client
# ---------------------------------------------------------------------------
client:
  description: >-
    Fetches snapshots from the server and loads them into a repository.
    Reference: FeatureSnapshotClient, driven by the polling transport in
    featurehub_connection.dart.
  configuration:
    url: {required: true, description: "Full URL of the endpoint; may already have query parameters."}
    send_context: {default: "true for app/browser (client) providers, false for server providers", description: "Send the repository's context as query parameters."}
    headers: {default: {}, description: "Sent with every request (gateway keys, auth, tracing)."}
    interval: {description: "Poll interval; also how long a response stays fresh."}
    request_timeout: {default: none, description: "Whole-request limit; exceeding it is an error (retried)."}
    connect_timeout: {default: none, description: "Only for an HTTP client the SDK creates."}
    http_client: {default: created, description: "Injectable (e.g. configured with a proxy)."}
  request:
    url_construction:
      - if send_context is false, or the context has no attributes, use url unchanged (no trailing "?")
      - "otherwise: the url's existing query parameters, then the context attributes (map of name -> list of strings, see encoding.evaluation_context), each list value as a repeated parameter; a context attribute replaces a same-named url parameter"
    example:
      url: https://my.app/api/features?app=web
      context: {targetingKey: fred, country: nz, tags: [a, b]}
      request: https://my.app/api/features?app=web&userkey=fred&country=nz&tags=a&tags=b
    headers:
      Accept: application/json
      "<custom headers>": from configuration.headers
      If-None-Match: 'the stored ETag, only if it was stored for exactly this request URL; otherwise omitted'
    freshness:
      - "record started = now before sending"
      - "an unforced request is skipped while now < next_allowed"
      - "after a 200 or 304: next_allowed = started + interval (from the request start, not the response, so a poll every interval is never skipped as fresh)"
  responses:
    - status: 200
      action:
        - decode with encoding.feature_snapshot.decoding (a format error is an error, retried)
        - "if the request URL (i.e. the context) changed while waiting, discard the response"
        - "store etag = response ETag header, or '\"' + snapshot.sha + '\"' if absent; remember the URL it belongs to"
        - "notify(features, snapshot.features) - a full set (transport.notifications)"
    - status: 304
      action: no change; update next_allowed
    - status: "4xx except 429"
      action: "permanent rejection: mark dead (no further requests), notify(failure)"
    - status: "anything else (5xx, 429), network error, timeout"
      action: raise an error; the caller logs it and a later request retries
  retryable_429: >-
    429 is retryable for the snapshot client only: your own server (or a
    gateway in front of it) may rate-limit. FeatureHub's own APIs are
    different: there every 4xx, 429 included, is permanent (see
    featurehub_edge.polling and featurehub_edge.streaming.connection_errors).
  browser_notes: >-
    Browsers pass author-set If-None-Match through and deliver a 304 to script
    (verified in Chrome). A client MUST also cope with a 200 served from the
    browser cache.

# ---------------------------------------------------------------------------
# 4. Polling / passive scheduling (shared by FeatureHub polling and snapshots)
# ---------------------------------------------------------------------------
polling_transport:
  serialisation: one request at a time; a forced request waits for the one in flight
  start:
    - "if the repository is already ready (e.g. loaded from a store): request in the background; else await the first request"
    - "then, in polling mode, schedule the next poll"
  polling_mode:
    schedule: >-
      After each poll finishes, wait until next_allowed (the poll interval,
      or a FeatureHub Cache-Control max-age that replaced it, after the
      request started; see featurehub_edge.polling.cache_control), then make
      a forced request, then schedule again. If next_allowed has already
      passed (the request failed, or took longer than the interval), wait
      the configured interval instead, so a failure never becomes a tight
      retry loop. Stop when closed or dead. A fixed periodic timer MUST NOT
      be used with an unforced freshness check: the tick lands microseconds
      inside the window and every other poll is skipped.
  passive_mode:
    refresh_if_stale: >-
      Called as flags are resolved (the server provider awaits it before each
      resolution; the app provider fires it without waiting, resolution being
      synchronous). Makes an unforced request.
    failure_backoff: after a failed request, no unforced request until now + interval
  context_changed: a forced request (fetches for the new context immediately)
  errors: logged; the next poll or refresh retries

# ---------------------------------------------------------------------------
# 5. The repository side (what notify must do)
# ---------------------------------------------------------------------------
repository:
  readiness: {initial: NotReady, values: [NotReady, Ready, Failed]}
  notifications:
    features:
      payload: list of feature_state (objects or JSON)
      semantics:
        - apply each feature with the update rule below
        - remove every held feature whose key is not in the set (keys only asked for by code, with no feature, are kept)
        - readiness becomes Ready and is broadcast (every time, so waiters for "the next ready" wake up)
        - recompute the SHA
    feature:
      payload: one feature_state
      semantics: apply with the update rule; recompute the SHA if applied
    deleteFeature:
      payload: one feature_state (only key/id needed)
      semantics: remove it (and, where catch-and-release is supported, any update for it held back); recompute the SHA
    bye:
      semantics: "readiness NotReady. Providers do NOT report stale: the connection is being re-established, and the features arrive again on reconnection"
    failure:
      semantics: "readiness Failed. Before any features: the provider's initialisation fails (PROVIDER_FATAL). After features: a permanent stop, so the provider reports STALE for good and keeps resolving from the last features"
  environment_stale:
    call: markEnvironmentStale() (not a notify state)
    semantics: >-
      The source says the environment is stale and will send no further
      updates (FeatureHub Edge's 236 when polling, or edge.stale when
      streaming),
      after the last features. Sets environmentStale = true, once; readiness
      is unchanged (it stays Ready), so initialisation is not delayed and
      resolutions continue from the last features. Providers report STALE,
      permanently. It is a separate signal from bye because bye makes the
      repository NotReady, which would make a first-response 236 fail
      initialisation.
  update_rule: >-
    Reject an incoming feature if the held one has a higher version, or the
    same version and the same value, v, id and type. Otherwise replace it.
    (Same-version replacement is needed because a server-evaluated feature
    changes value/v without a version change when the context changes, and
    a stored/local feature may differ in id or type.)

# ---------------------------------------------------------------------------
# 6. Transport contract (pluggable sources: WebSockets, other SSE clients, ...)
# ---------------------------------------------------------------------------
transport:
  description: >-
    A transport moves features from any source into the repository. The
    built-in ones are FeatureHub streaming (SSE), FeatureHub polling, and the
    snapshot client. A user-supplied factory replaces them.
  factory: "transportFactory(target: FeatureHubTransportTarget) -> FeatureHubTransport"
  target_fields:
    repository: the repository to notify
    host: FeatureHub Edge URL, if configured
    apiKey: FeatureHub API key, if configured
    featuresUrl: your own server's URL, if configured
    mode: "streaming | polling | passive"
    pollInterval: duration
    headers: map to send with every request
    reconnectPolicy: reconnection delays (FeatureHub SSE semantics)
    connectTimeout: duration or none
    requestTimeout: duration or none
    dio: the configured HTTP client for requests, if supplied
    httpClient: the configured HTTP client for streaming, if supplied
    sendsContext: true if the source must be told the context (it returns features evaluated for it)
    contextAttributes: "derived: map name -> list of strings of the current context; empty if not sendsContext"
    contextHeader: "derived: encoding.evaluation_context.x_featurehub_header of the current context; null if not sendsContext or no attributes"
  methods:
    start:
      must: begin fetching; give the first full set via notify(features)
      returns: may complete before features arrive; initialisation waits (up to waitForReady) for readiness
    contextChanged:
      called: only when sendsContext, after the repository's context has been replaced
      must: fetch for the new context and notify a full set; the caller waits (up to its timeout) for the next readiness notification
    refreshIfStale:
      called: passive mode, on resolution
      must: fetch if older than pollInterval; otherwise do nothing (a no-op is fine for push transports)
    close:
      must: stop and release connections
  notifications:   # the only calls a transport needs to make
    - {call: "notify(features, list)", when: "a full set; the first makes the provider ready"}
    - {call: "notify(feature, one)", when: one feature added or updated}
    - {call: "notify(deleteFeature, one)", when: one feature deleted}
    - {call: "notify(bye, null)", when: "connection lost, being re-established (the provider stays ready; it is not reported as stale)"}
    - {call: "notify(failure, null)", when: "permanently rejected, e.g. invalid key (provider reports fatal); stop trying"}
    - {call: "markEnvironmentStale()", when: "after the last features, FeatureHub says the environment is stale (polling 236, streaming edge.stale): provider reports STALE for good and keeps resolving; stop"}
  relaying_featurehub_events:
    description: >-
      FeatureHub Edge's SSE stream uses these event names with JSON `data:`;
      a transport carrying them verbatim maps name -> notification and passes
      the decoded data.
    event_names:
      ack: ignore
      bye: bye
      failure: failure
      features: features
      feature: feature
      delete_feature: deleteFeature
      config: 'not a repository event: data {"edge.stale": true} means the environment will never change again: markEnvironmentStale(), then stop (no reconnect, no bye)'
      error: ignore
  example_websocket_protocol:
    description: >-
      The protocol used by the reference test
      (featurehub-openfeatures-common/test/openfeature/custom_transport_test.dart);
      any protocol works, this is an illustration.
    connect: "WebSocket to featuresUrl, sending target.headers"
    server_to_client: '{"event": "<event name>", "data": <JSON payload>}'
    client_to_server_on_start_and_context_change: '{"context": {"userkey": ["fred"], ...}}'
    on_socket_closed: notify(bye)

# ---------------------------------------------------------------------------
# 7. Provider wiring
# ---------------------------------------------------------------------------
providers:
  source_selection:
    - {given: "host + apiKey", transport: "FeatureHub streaming (default) or polling/passive"}
    - {given: "featuresUrl", transport: "snapshot client, polling (default) or passive; streaming is an error unless a transportFactory is given"}
    - {given: "transportFactory", transport: "the custom transport (it may use any of host, apiKey, featuresUrl)"}
    - {given: "only stores", transport: "none; features come from stores"}
  validation_errors:
    - only one of host/apiKey given (empty strings count as not given)
    - featuresUrl together with host or apiKey
    - featuresUrl with streaming and no transportFactory
    - "nothing to get features from (no host+apiKey, featuresUrl, transportFactory or stores)"
    - "server provider: polling/passive without a pollInterval"
  local_evaluation_rule:
    description: Whether resolutions evaluate strategies locally (clientEvaluated) or the source is sent the context (sendsContext = !clientEvaluated).
    rules:
      - "apiKey given: clientEvaluated = the key contains '*'"
      - "else featuresUrl or transportFactory given: clientEvaluated = !sendContext"
      - "else (stores only): clientEvaluated = true"
  context_change:
    when_sends_context: >-
      Map the new context; if its x-featurehub form equals the current one do
      nothing; otherwise report RECONCILING (app provider), replace the
      repository's context, call transport.contextChanged, wait (up to
      waitForReady) for the next readiness notification, then report
      CONTEXT_CHANGED. Once the provider is stale (its source stopped for
      good), nothing can be fetched: a context change reports CONTEXT_CHANGED
      at once (no RECONCILING, no fetch) and the last features are kept. The
      server provider does this per resolution, serialised, so it serves one
      context at a time.
    when_local: nothing to fetch; each resolution evaluates against its own context
  events:
    - {on: "first readiness within waitForReady", event: READY}
    - {on: "not ready within waitForReady", event: "ERROR (GENERAL): '<source> did not become ready within <waitForReady>'"}
    - {on: "Failed before any features (during initialisation)", event: "ERROR (PROVIDER_FATAL); initialisation fails"}
    - {on: "bye (a lost connection being re-established)", event: "none: the provider stays ready"}
    - on: "a permanent stop after features: Failed (a rejection, a browser connection error), or the FeatureHub environment going stale (polling 236, streaming edge.stale)"
      event: >-
        STALE, after READY (even if the stop came with the first response),
        once; never followed by READY or ERROR. Resolutions continue from the
        last features, with their usual reasons.
    - {on: "applied changes that alter a feature's version, or remove/add one", event: "CONFIGURATION_CHANGED with the changed keys"}
  resolution: >-
    How a resolved feature becomes an OpenFeature result (reasons, variants,
    type conversion, error codes, flag metadata) is specified in
    openfeature-resolution.yaml.
  headers_and_clients:
    headers: sent by every built-in transport (except browser SSE, whose EventSource cannot send headers; a warning is logged) and given to custom transports
    proxy: >-
      Supply HTTP clients configured with a proxy. Proxy credentials belong on
      the HTTP client (e.g. proxy credentials API), not in `headers`, which go
      to the origin server.

# ---------------------------------------------------------------------------
# 7b. The built-in FeatureHub Edge transports
# ---------------------------------------------------------------------------
featurehub_edge:
  description: >-
    How the built-in transports talk to FeatureHub Edge itself (not your own
    server). Reference: featurehub_config.dart (polling),
    sse_client_dartio.dart and sse_client_web.dart (streaming).
  extra_headers:
    rule: >-
      Both FeatureHub transports, polling and streaming, MUST let the
      application configure extra headers (for example for an API gateway,
      a proxy in front of Edge, extra authentication or tracing) and MUST
      send them with every request: each poll, and each streaming connection
      and reconnection.
    precedence: >-
      The SDK's own protocol headers win over an extra header of the same
      name: x-featurehub (the context, for a server-evaluated key) on both,
      and If-None-Match where it is used. Other extra headers are sent as
      given.
    browsers: >-
      A browser's EventSource cannot send headers, so in a browser extra
      headers are only sent when polling; a client SHOULD warn if they are
      configured for streaming (the Dart client logs a warning).
    dart: >-
      The providers' and FeatureHubConnection's `headers` option, passed to
      FeatureHubConfig (polling) and the SSE listener (streaming); custom
      transports get them as FeatureHubTransportTarget.headers.
  polling:
    request: >-
      GET <host>/features?apiKey=<key>&contextSha=<sha256 of the
      x-featurehub header, or 0>; with the x-featurehub header for a
      server-evaluated key, and the extra headers (extra_headers).
    responses:
      - {status: 200, action: "load the features (an array of environments, each with its features): a full set"}
      - status: 236
        action: >-
          load the features as for 200, then stop polling for good and
          markEnvironmentStale(). Not a failure and not a lost connection:
          readiness stays Ready and the provider reports STALE, permanently.
      - {status: "4xx", action: "the key is rejected: notify(failure), stop polling. Every 4xx, 429 included (unlike the snapshot client, which retries 429)"}
      - {status: "other, or a network error / timeout", action: "an error; the next poll retries"}
    cache_control:
      rule: >-
        If a 200 or 236 response has a Cache-Control header containing
        max-age=<n> (the first `max-age=(\d+)` match) and n > 0, the polling
        interval becomes n seconds, replacing the configured one, whether
        shorter or longer. It applies to every later poll (and to passive
        mode's freshness) until another max-age changes it; a response
        without one leaves it as it is. A missing, zero or unparseable
        max-age changes nothing.
      typescript_reference: >-
        parseCacheControl: cacheHeader.match(/max-age=(\d+)/); if the parsed
        value > 0, frequency = value * 1000 ms.
      dart_difference: the Dart SDK matches max-age case-insensitively; TypeScript is case-sensitive
      snapshot_client: "not applied: the snapshot client (your own server) polls at its configured interval and uses ETags instead"
  streaming:
    request: >-
      An SSE stream from <host>/features/<key>, sending the x-featurehub
      header (dart:io) or the xfeaturehub query parameter (browsers, whose
      EventSource cannot send headers), for a server-evaluated key; and, on
      dart:io, the extra headers (extra_headers) on every connection and
      reconnection.
    go_status: >-
      The Go SDK does not support server-evaluated keys over streaming: it
      does not send the x-featurehub header (or the xfeaturehub parameter) on
      the SSE connection. Go applications with a server-evaluated key use
      polling, which does send it.
    events:
      - "features / feature / delete_feature: as transport.relaying_featurehub_events"
      - "failure: notify(failure), close; no reconnect"
      - "bye, or the stream dropping: notify(bye) (the provider stays ready; it is not reported as stale), and reconnect under the reconnect policy"
      - >-
        config {"edge.stale": true}: arrives after the features have been
        delivered; markEnvironmentStale(), close the stream, and do not
        reconnect or send bye. Readiness stays Ready; the provider reports
        STALE, permanently.
    connection_errors:
      description: >-
        When the stream cannot be opened, or a reconnection attempt fails, an
        SSE client that is not a browser's EventSource (which hides the HTTP
        status) MUST determine whether the failure was a 4xx or a 5xx
        response, as they mean opposite things.
      classification:
        - status: 4xx
          meaning: "permanent: the API key or environment is rejected. Every 4xx, 429 included (unlike the snapshot client, which retries 429)"
          action: "notify(failure) and stop: no further attempts (before any features the provider fails to initialise; after them it goes STALE for good)"
        - status: 5xx
          meaning: "temporary: Edge, or something in front of it, is failing"
          action: "notify(bye) (the provider stays ready) and keep trying, with a backoff"
        - status: "no status: a network error, a timeout, or the stream ending"
          meaning: temporary
          action: "notify(bye) and keep trying, with a backoff"
        - status: "any other non-200 (1xx, 3xx)"
          meaning: unexpected
          action: stop, as for a permanent failure (the reference treats only 5xx as retryable)
      backoff: >-
        Retries SHOULD wait longer after a 5xx than after a network error, and
        SHOULD grow with each consecutive failure up to a cap, so a failing Edge
        is not hammered. The count resets once a connection opens. A
        configurable maximum number of attempts MAY stop retrying; running out
        of attempts is still a temporary failure (bye), not a rejection.
      reference_defaults: >-
        Dart (defaultReconnectPolicy, a featurehub_sse_client ReconnectPolicy):
        3s after a network error or a dropped stream (a server retry: field
        may replace it), 30s after a 5xx; delay = base *
        backoffMultiplier^(attempt - 1), capped at maxDelay, with
        backoffMultiplier 2 and maxDelay 5 minutes; unlimited attempts;
        shouldRetryStatus 5xx only.
      configuration: >-
        Every value MUST be configurable by the application: the network-error
        delay, the 5xx delay, the multiplier, the cap, the maximum number of
        attempts, and which statuses are retried (Dart: the providers'
        reconnectPolicy option).
      browsers: >-
        A browser's EventSource does not expose the status of a failed
        connection, so a browser client cannot tell a 4xx from a 5xx. A
        connection error (the EventSource closing: readyState CLOSED) is
        therefore final: the client notifies failure and stops, with no
        further attempts. Before any features the provider's initialisation
        fails (PROVIDER_FATAL); after them the provider goes STALE for good,
        keeping the last features. A dropped connection the browser reconnects by
        itself (readyState CONNECTING) is only a bye. A connection that the
        client's own request timeout abandons MAY be retried under the
        reconnect policy; running out of attempts is then also final.

# ---------------------------------------------------------------------------
# 8. Conformance checks (each is a test in the reference implementation)
# ---------------------------------------------------------------------------
conformance:
  - id: sha-vectors
    check: encoding.sha.test_vectors all reproduce
  - id: snapshot-roundtrip
    check: "decode(encode(snapshot)) loads the same features; the client's repository SHA equals the server's"
  - id: evaluate-for-context
    given: "feature colour, value blue, strategy nz (country EQUALS nz) -> green"
    expect:
      "country=nz": {value: green, v: nz, strategies: absent}
      "country=au": {value: blue, v: null}
  - id: conditional-304
    check: "a request with If-None-Match equal to the ETag (alone, as W/\"...\", or in a comma list) gets 304; another tag gets 200"
  - id: client-if-none-match-per-url
    check: "after a context change the first request carries no If-None-Match"
  - id: client-discards-stale-context
    check: "a response that arrives after the context changed is not loaded"
  - id: client-rejection
    check: "401 marks the client dead, notifies failure, and stops polling"
  - id: client-retry
    check: "500 leaves the repository not ready; the next poll succeeds"
  - id: polling-every-interval
    check: "with a 1s interval, 4 requests are made in 3.5s (initial + 3)"
  - id: passive
    check: "refreshIfStale fetches only after the interval; no requests of its own otherwise"
  - id: custom-transport
    check: "a user transport fills the repository, follows a context change, applies pushed updates, and a closed connection makes the repository NotReady"
