# FeatureHub feature stores: a machine-readable specification.
#
# A store keeps a copy of a repository's features outside it (browser
# storage, Redis, ...) or supplies features of its own (a local YAML file),
# so features exist before, or without, FeatureHub. This specifies the store
# contract, how the repository treats store features, the shared on-disk /
# in-Redis formats (so SDKs in different languages can share data), and how
# stores pair with value interceptors.
#
# Reference implementation:
#   featurehub-openfeatures-common  lib/src/store/feature_store.dart,
#                                   lib/src/store/raw_feature_update.dart,
#                                   lib/src/repository.dart
#   featurehub-openfeatures-store-localstorage  (LocalSessionStore)
#   featurehub-openfeatures-store-redis         (RedisFeatureStore)
#   featurehub-openfeatures-yaml-interceptor    (LocalYamlFeatureStore,
#                                                LocalYamlValueInterceptor)
# The local storage and Redis formats match the FeatureHub TypeScript SDK.
#
# MUST / SHOULD / MAY as in RFC 2119.

spec:
  name: featurehub-feature-store
  version: 1.0.0
  status: implemented-in-dart
  related:
    encoding: feature-snapshot-protocol.yaml encoding (FeatureState JSON, the SHA)
    resolution: openfeature-resolution.yaml (interceptors never create flags)

# ---------------------------------------------------------------------------
# Catch-and-release: an optional feature
# ---------------------------------------------------------------------------
catch_and_release:
  description: >-
    Catch-and-release holds feature updates back until the application calls
    release(), so a user interface does not change under the user. It is
    only supported by some SDKs, typically those used for user interfaces
    (this Dart/Flutter SDK, and the JavaScript/TypeScript SDK). The Ruby,
    Python, Go and Java SDKs do not support it.
  implementations_without_it: >-
    MUST ignore every rule and check below marked
    `only_with: catch_and_release`; nothing else in this specification
    depends on it.

# ---------------------------------------------------------------------------
# 1. The store contract
# ---------------------------------------------------------------------------
store:
  interface:
    attach:
      signature: "attach(target: FeatureStoreTarget) -> async"
      must:
        - load any features the store holds into target.repository with notify(features, list, source = <the store's own source>)
        - "if the store keeps a copy: subscribe to the repository's raw feature updates and keep the copy up to date, ignoring updates whose source is its own"
      returns: once its features (if any) are loaded, so the provider can be ready straight away
      on_error: the provider logs it and carries on without the store
    connected:
      signature: "connected -> bool"
      meaning: attached and operational
    close:
      signature: "close() -> async"
      must: stop following updates and release resources (connections, timers)
      note: a closed store is not expected to be attached again; create a new one
  target:   # FeatureStoreTarget
    repository: the repository to load into and follow
    host: FeatureHub Edge URL, or null without a FeatureHub connection
    apiKey: FeatureHub API key, or null
    featuresUrl: your own server's features API, if the features come from there
    derived:
      connectsToFeatureHub: host and apiKey are both set
      clientEvaluated: "apiKey is set and contains '*'; false without an API key"
      environmentId: >-
        From the API key: the middle part of "portfolio/environment/key", or
        the first part of "environment/key"; otherwise (including no key) the
        placeholder 3ea0f571-c153-48bf-9543-df76c6f9ca50 (the TypeScript
        SDK's placeholder).
      featureUrl: >-
        "<host without a trailing slash>/features/<apiKey>" with a FeatureHub
        connection; else featuresUrl; else null. Unique to the environment
        and key, so suitable as a storage key.
    environment_id_vectors:
      - {apiKey: "default/a1b2c3/key*secret", environmentId: a1b2c3}
      - {apiKey: "a1b2c3/key", environmentId: a1b2c3}
      - {apiKey: "nonsense", environmentId: 3ea0f571-c153-48bf-9543-df76c6f9ca50}
  provider_lifecycle:
    - "the provider attaches its stores, in order, after registering its interceptors and before starting its connection, so stored features are available at once"
    - "a store's full set makes the repository ready; the provider's wait for readiness then returns at once, and a polling connection makes its first request in the background"
    - "on shutdown, and when initialisation fails (not ready in time, or rejected), the provider closes its stores"

# ---------------------------------------------------------------------------
# 2. Raw feature updates (what a store follows)
# ---------------------------------------------------------------------------
raw_feature_updates:
  description: >-
    A stream of every feature change as it arrives at the repository, before
    any catch-and-release handling (where supported), with its source. Delivered asynchronously
    (after notify returns), to any number of listeners.
  sources:
    featurehub-edge: >-
      FeatureHub (streaming or polling), and also the default for any notify
      without an explicit source: your own server's snapshots and custom
      transports.
    local-session-store: the browser storage store
    redis-store: the Redis store
    local-yaml-store: the YAML store
  events:
    FeaturesReceived: {fields: [features, source], meaning: "a complete set, replacing all previous features"}
    FeatureReceived: {fields: [feature, source], meaning: "one feature added or changed"}
    FeatureDeleted: {fields: [feature, source], meaning: "one feature deleted"}
  rules:
    - "events are published for every notify of features, feature or deleteFeature (where catch-and-release is supported, including updates it holds back)"
    - "identify features by id (a feature's key can change)"
    - "a store MUST ignore events with its own source, or loading its features would write them straight back"

# ---------------------------------------------------------------------------
# 3. How the repository treats store features
# ---------------------------------------------------------------------------
repository_rules:
  - id: store-features-are-features
    rule: a store's full set is applied like any other (update rule, missing features removed, repository ready)
  - id: store-features-do-not-start-catch-and-release
    only_with: catch_and_release
    rule: >-
      Catch-and-release only takes effect after the first full set from the
      FeatureHub source (featurehub-edge), or a failure. Features from a
      store do not count, so FeatureHub's first features replace them rather
      than being held back.
  - id: fresh-full-set-removes-store-only-flags
    rule: >-
      A later full set (e.g. FeatureHub's) removes features it does not
      contain, including flags that only a store supplied.
  - id: same-version-replacement
    rule: >-
      An incoming feature replaces a held one at the same version if its
      value, v, id or type differs (see feature-snapshot-protocol.yaml
      repository.update_rule), so FeatureHub's feature replaces a store's
      even when the store gave it the same version.
  - id: deletes-clear-held-updates
    only_with: catch_and_release
    rule: a delete also discards any update for that feature held back by catch-and-release

# ---------------------------------------------------------------------------
# 4. Browser storage store (LocalSessionStore)
# ---------------------------------------------------------------------------
local_storage_store:
  platform: browsers (sessionStorage by default, or localStorage)
  source: local-session-store
  storage_key: "target.featureUrl, or \"featurehub-features\" if that is null"
  format: >-
    One storage item: a JSON object mapping each feature's id to its
    FeatureState JSON. Same key and format as the TypeScript SDK's store.
  example_item:
    key: https://edge.example.com/features/default/a1b2c3/key
    value: '{"fv-pastry":{"id":"fv-pastry","key":"kwong-pastry","l":false,"version":2,"type":"STRING","value":"mango"}}'
  attach:
    - read the item; if it is absent, unreadable or not a JSON object, start empty (no error)
    - otherwise notify(features, the stored features, source = local-session-store)
    - follow raw feature updates
  on_update:   # events from other sources
    FeaturesReceived: replace the whole map with the new set
    FeatureReceived: set map[id] = the feature
    FeatureDeleted: remove map[id]
    then: write the item; a write failure (storage full or disabled) is logged and ignored
  difference_from_typescript: a deleted feature is removed from storage; the TypeScript store keeps it, so a reload could bring a deleted flag back
  note: >-
    For a server-evaluated key the stored features are those evaluated for
    the context at the time; a later context starts with them until
    FeatureHub answers.

# ---------------------------------------------------------------------------
# 5. Redis store (RedisFeatureStore)
# ---------------------------------------------------------------------------
redis_store:
  platform: servers (dart:io); Redis Cluster not supported
  source: redis-store
  purpose: >-
    Several processes share one copy of an environment's features; each
    starts with them, and receives updates other processes write even if its
    own FeatureHub connection fails.
  keys:
    features: "<prefix>_<environmentId>: a JSON array of FeatureState JSON"
    sha: "<prefix>_<environmentId>_sha: the SHA of those features (feature-snapshot-protocol.yaml encoding.sha)"
    prefix_default: featurehub
    example: {features: featurehub_a1b2c3, sha: featurehub_a1b2c3_sha}
  options:
    prefix: featurehub
    backoff: 500ms (wait before retrying an interrupted write)
    retryUpdateCount: 10 (write attempts before giving up)
    refreshInterval: 5 minutes (check for other processes' writes)
  attach:
    refuse_when:   # log severe, don't attach
      - "no API key: the keys are named by the environment"
      - "a server-evaluated key: evaluated features for one context must not be shared"
    then:
      - read the sha key; remember it as last_sha
      - if set, read the features key and notify(features, them, source = redis-store); unreadable JSON is ignored
      - follow raw feature updates
      - every refreshInterval, run refresh
  refresh: "read the sha key; if set and different from last_sha, set last_sha and load the features as at attach"
  serialisation: all Redis operations for a store run one at a time, in order
  on_update:   # events from other sources
    FeaturesReceived:
      - compute the incoming SHA; if it equals the stored sha, do nothing
      - "if Redis has features and none of the incoming is newer (by id, version), do nothing"
      - otherwise write the incoming features
      - "note: as in the TypeScript SDK, a full set that only removes features (nothing newer) is not written"
    FeatureReceived:
      - "if Redis holds that id at the same or a higher version, do nothing"
      - otherwise write the stored features with this one replacing (or added to) them
    FeatureDeleted:
      - if Redis does not hold that id, do nothing
      - otherwise write the stored features without it
  write:   # optimistic locking
    steps:
      - "sha = SHA(to_write)"
      - "repeat up to retryUpdateCount times:"
      - "  WATCH <sha key>; read current sha"
      - "  if current == sha: UNWATCH; last_sha = sha; done"
      - "  if current is set and != last_sha (another process wrote): read the stored features; if none of to_write is newer, UNWATCH and stop (ours are stale); else to_write = merge(to_write, stored), sha = SHA(to_write)"
      - "  MULTI; SET <sha key> sha; SET <features key> JSON(to_write); EXEC"
      - "  if EXEC succeeded: last_sha = sha; done"
      - "  else wait backoff and try again"
      - "after the last attempt: log severe and give up"
    merge: "by id, keeping the higher version; incoming wins only if strictly newer (a missing feature counts as version -1)"
    known_limit: >-
      As in the TypeScript SDK, a delete is skipped when another process has
      written since this one last read (nothing in to_write is newer than
      what is stored).

# ---------------------------------------------------------------------------
# 6. YAML store and interceptor (local development)
# ---------------------------------------------------------------------------
yaml:
  platform: dart:io (reads local files); development and testing only
  file:
    resolution: "the filename given; else the FEATUREHUB_LOCAL_YAML environment variable (trimmed, if not empty); else featurehub-features.yaml in the current directory"
    format: a single top-level map `flagValues`, from feature key to value
    example: |
      flagValues:
        kwong-pastry: mango
        keep-silent: true
        always-wonder: 42
        ling-orm: {shop: "omu&co"}
        chago: ~
    errors: a missing, unreadable or malformed file, or one without a flagValues map, gives no values (logged)
    yaml_numbers: "a whole-number float (1.0) is read as an integer, as JavaScript does (so it becomes \"1\" as a string)"
  store:   # LocalYamlFeatureStore
    source: local-yaml-store
    reads: once, when attached (or when load is called)
    feature_per_entry:
      id: "the first 8 hex digits of SHA-256(UTF-8 key), lowercase"
      key: the entry's key
      l: false
      version: 0
      type: detect_type(value)
      value: prepare_value(type, value)
      environmentId: target.environmentId
    detect_type:
      - "a boolean -> BOOLEAN"
      - "null -> STRING (with no value)"
      - "a string equal to true or false in any case -> BOOLEAN"
      - "any other string -> STRING"
      - "a number -> NUMBER"
      - "a map or list -> JSON"
    prepare_value:
      BOOLEAN: "a boolean as is; otherwise true only if its string form is true in any case"
      STRING: "its string form; null stays null"
      NUMBER: the number
      JSON: "JSON text (a string); null if it cannot be encoded"
    id_vectors:
      - {key: my-feature, id: fe6e9d24}
      - {key: alpha, id: 8ed3f6ad}
      - {key: kwong-pastry, id: 51a62218}
  interceptor:   # LocalYamlValueInterceptor
    reads: the same file (same resolution); with watchForChanges, rereads it when its type, modification time or size changes (checked every 500ms by default)
    matches: keys in the file, for features that exist (an interceptor never creates a flag; openfeature-resolution.yaml)
    lock_override: overrides locked features too
    converts_to_the_feature_type:
      BOOLEAN: "true (also as a string, in any case) is true; anything else, including null, is false"
      NUMBER: "numbers, and numeric strings (\"99\"); anything else is no value"
      STRING: "strings, numbers and booleans as text; maps and lists are no value"
      JSON: "strings as they are; anything else as JSON text"
    null: no value (resolves to the code default) for every type but BOOLEAN
  pairing:
    description: >-
      The store and the interceptor read the same file and are used
      together: the store creates the flags (so they exist, with a type), the
      interceptor supplies the values and picks up edits.
    behaviour:
      - "on start: the store loads every entry as a feature; the provider is ready and every flag in the file resolves"
      - "on resolution: the interceptor supplies the value, converted to the feature's type"
      - "on editing a value: the interceptor rereads the file; the next resolution uses it"
      - "when FeatureHub's features arrive: they replace the store's (version 0 loses, and differing ids are replaced); flags only in the file are removed and resolve as FLAG_NOT_FOUND; the interceptor keeps overriding flags in both"
    limits:
      - "a key added to the file while running has no feature until the store loads again, so it resolves as FLAG_NOT_FOUND"
      - "a feature keeps the type it was loaded with; an edit implying another type is converted to the original type"

# ---------------------------------------------------------------------------
# 7. Conformance checks (each is a test in the reference implementation)
# ---------------------------------------------------------------------------
conformance:
  - {id: own-source-ignored, check: "a store's own loaded features are not written back"}
  - {id: stored-features-first, check: "with stored features the provider is ready before FeatureHub answers"}
  - {id: no-catch-from-store, only_with: catch_and_release, check: "with catch-and-release on, FeatureHub's first features replace the store's"}
  - {id: full-set-removes, check: "FeatureHub's full set removes store-only flags"}
  - {id: local-storage-format, check: "the item key and JSON object format above; a delete removes the entry"}
  - {id: redis-sha-compatible, check: "the stored sha matches the SHA algorithm's test vectors and the TypeScript implementation"}
  - {id: redis-merge, check: "a write after another process wrote keeps the higher version of each feature"}
  - {id: redis-refuses, check: "no attach without an API key, or with a server-evaluated key"}
  - {id: yaml-ids, check: "yaml.store.id_vectors"}
  - {id: yaml-pairing, check: "the store and interceptor together: values from the file, edits picked up, FeatureHub's features replacing the store's"}
  - {id: interceptor-unknown-key, check: "an interceptor matching a key with no feature resolves FLAG_NOT_FOUND"}
