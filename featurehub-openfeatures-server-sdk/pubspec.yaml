name: featurehub_openfeatures_server_sdk
version: 1.0.0
description: FeatureHub provider for the OpenFeature Dart server SDK, for servers and command line applications (dart:io).
repository: https://github.com/featurehub-io/featurehub-flutter-sdk/tree/main/featurehub-openfeatures-server-sdk
homepage: https://www.featurehub.io
environment:
  sdk: ^3.12.2
platforms:
  linux:
  macos:
  windows:
dependencies:
  dio: ^5.0.1
  featurehub_client_api:
    path: ../featurehub-client-api
  featurehub_openfeatures_common:
    path: ../featurehub-openfeatures-common
  featurehub_sse_client:
    path: ../featurehub-sse-client
  http: ^1.5.0
  logging: ^1.3.0
  openfeature_dart_server_sdk: ^0.1.0
dev_dependencies:
  lints: ^6.0.0
  # for the example
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  test: ^1.26.3
