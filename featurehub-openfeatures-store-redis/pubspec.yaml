name: featurehub_openfeatures_store_redis
version: 1.0.0
description: Redis storage for the FeatureHub OpenFeature server provider, sharing features between processes in the format every FeatureHub SDK uses.
repository: https://github.com/featurehub-io/featurehub-flutter-sdk/tree/main/featurehub-openfeatures-store-redis
homepage: https://www.featurehub.io
environment:
  sdk: ^3.12.2
platforms:
  linux:
  macos:
  windows:
dependencies:
  crypto: ^3.0.6
  featurehub_client_api:
    path: ../featurehub-client-api
  featurehub_openfeatures_common:
    path: ../featurehub-openfeatures-common
  logging: ^1.3.0
  redis: ^4.1.0
dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3
